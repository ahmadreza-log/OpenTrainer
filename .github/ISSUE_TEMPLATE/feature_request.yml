name: Feature request
description: Suggest an improvement to the OpenTrainer application.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
  - type: checkboxes
    id: scope
    attributes:
      label: Project scope
      options:
        - label: This doesn't involve anti-cheat bypasses or competitive multiplayer manipulation
          required: true
